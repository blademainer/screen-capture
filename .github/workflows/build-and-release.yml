name: Build and Release MacScreenCapture

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          mkdir -p build
          swift test 2>&1 | tee build/test.log

      - name: Determine package version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal ZIP and DMG (ad-hoc signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: MacScreenCapture-universal-${{ steps.version.outputs.version }}
          path: |
            build/MacScreenCapture-*-universal-macOS.zip
            build/MacScreenCapture-*-universal-macOS.dmg
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          pattern: MacScreenCapture-universal-*
          path: release
          merge-multiple: true

      - name: Verify package checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" release/*.zip release/*.dmg release/SHA256SUMS \
            --verify-tag --title "MacScreenCapture $TAG" --generate-notes \
            --notes 'Requires macOS 15 or later. Universal app for Apple Silicon and Intel. Ad-hoc signed only: no Developer ID signature or Apple notarization. Install MacScreenCapture.app in Applications; macOS may require approval in Privacy & Security. Grant Screen Recording and optional Microphone permissions when requested.' \
            "${FLAGS[@]}"
